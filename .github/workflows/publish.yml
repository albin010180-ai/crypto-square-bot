name: Square Publish

on:
  schedule:
    - cron: "5 */4 * * *" # Her 4 saatte bir (UTC) - 5 dk offset
  workflow_dispatch:
    inputs:
      force:
        description: "Gecmisi yoksay, daha once kullanilan haberlerle de yayin yap"
        type: boolean
        default: false
      mode:
        description: "Icerik modu"
        type: choice
        default: auto
        options:
          - auto
          - info
  push:
    paths:
      - "data/heartbeat.json"
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: square-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Zaman kontrolu - son calismadan 4 saat gecmeli
        if: github.event_name == 'push'
        id: timecheck
        run: |
          NOW=$(date +%s)
          LAST=$(cat data/heartbeat.json 2>/dev/null | node -pe "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).lastRun || 0" 2>/dev/null || echo "0")
          DIFF=$(( NOW - LAST ))
          echo "Son calismadan bu yana: ${DIFF} saniye"
          if [ "$DIFF" -lt 14000 ]; then
            echo "Henuz 4 saat gecmedi, atlaniyor."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "4 saatten fazla gecti, devam ediliyor."
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Haber topla, makale yaz ve yayinla
        if: github.event_name != 'push' || steps.timecheck.outputs.skip != 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          BINANCE_SQUARE_OPENAPI_KEY: ${{ secrets.BINANCE_SQUARE_OPENAPI_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          FORCE_PUBLISH: ${{ inputs.force }}
          CONTENT_MODE: ${{ github.event.inputs.mode }}
          PUBLISH_ENABLED: ${{ vars.PUBLISH_ENABLED || 'true' }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: node run.mjs

      - name: Heartbeat ve durum kaydet
        if: always()
        run: |
          NOW=$(date +%s)
          echo "{\"lastRun\": $NOW}" > data/heartbeat.json
          git config user.name "crypto-square-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Degisiklik yok, commit atlanıyor."
          else
            git commit -m "bot: durum guncellemesi [skip ci]" || true
            git pull --rebase || git pull --no-rebase || true
            git push || (git push --force-with-lease || true)
          fi
