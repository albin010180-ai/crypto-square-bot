name: Trending Topics Monitor

on:
  schedule:
    - cron: "*/2 * * * *" # Her 2 dakikada bir
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Dry-run modu (sadece goster, yayinlama)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: trending-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Trending konulari kontrol et ve yayinla
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          BINANCE_SQUARE_OPENAPI_KEY: ${{ secrets.BINANCE_SQUARE_OPENAPI_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
        run: node trending.mjs --once $(if [ "${{ inputs.dryRun }}" = "true" ]; then echo "--dry-run"; fi)

      - name: Durumu repoya kaydet
        if: always()
        run: |
          git config user.name "crypto-square-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Degisiklik yok, commit atlaniyor."
          else
            git commit -m "trending: durum guncellemesi [skip ci]"
            git pull --rebase || true
            git push
          fi
