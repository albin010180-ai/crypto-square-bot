name: Square Video

on:
  schedule:
    # Makalelerden ONCE garantili calismasi icin makale saatinden 2.5 saat once hedeflenir:
    # planli: UTC 01:30, 05:30, 09:30, 13:30, 17:30, 21:30
    # GitHub zamanlanmis isleri 10-80 dk geciktirebilir; bu tampon sayesinde
    # video her kosulda ayni saatteki (UTC 04:00 vb.) makaleden once yayinlanir.
    - cron: "30 1-21/4 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Tekrar korumasini yoksay (zorla yayinla)"
        type: boolean
        default: false
      mode:
        description: "Icerik modu"
        type: choice
        default: auto
        options:
          - auto
          - info

permissions:
  contents: write

concurrency:
  group: square-video
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Repoyu cek
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Node kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ffmpeg kurulumu
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -n1

      - name: TTS ve gorsel bagimliliklarini kur
        run: |
          pip install --quiet edge-tts gTTS pillow
          python3 --version

      - name: Video uret ve yayinla
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          BINANCE_SQUARE_OPENAPI_KEY: ${{ secrets.BINANCE_SQUARE_OPENAPI_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          VIDEO_LANGS: ${{ vars.VIDEO_LANGS }}
          FORCE_PUBLISH: ${{ github.event.inputs.force == 'true' && 'true' || 'false' }}
          VIDEO_MODE: ${{ github.event.inputs.mode }}
        run: node video.mjs

      - name: Durum dosyalarini kaydet
        if: always()
        run: |
          git config user.name "crypto-square-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "Degisiklik yok" || git commit -m "video state [skip ci]"
          git pull --rebase || true
          git push || true
